<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>指尖造藝 - 專屬穿戴甲</title>
  
  <!-- Tailwind & React & Babel -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script defer crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Firebase (新增 Auth 模組) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-[#FAF9F8] text-gray-800 font-sans">
  
  <div id="root">
    <style>
      .preloader { position: fixed; inset: 0; background-color: #FAF9F8; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
      .preloader-spinner { width: 50px; height: 50px; border: 4px solid rgba(236, 72, 153, 0.1); border-left-color: #ec4899; border-radius: 50%; animation: spin 1s linear infinite; }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      .preloader-text { margin-top: 16px; color: #9ca3af; font-family: sans-serif; font-weight: bold; font-size: 14px; letter-spacing: 2px; }
      .hide-scrollbar::-webkit-scrollbar { display: none; }
      .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      html { scroll-behavior: smooth; }
    </style>
    <div class="preloader">
      <div class="preloader-spinner"></div>
      <div class="preloader-text">載入中...</div>
    </div>
  </div>

  <script type="text/babel">
    const firebaseConfig = {
      apiKey: "AIzaSyDQZGeeubB8bEUL59v9yt0QBAfIWJcvgnw",
      authDomain: "nailproject-40022.firebaseapp.com",
      projectId: "nailproject-40022",
      storageBucket: "nailproject-40022.firebasestorage.app",
      messagingSenderId: "1004628981925",
      appId: "1:1004628981925:web:db01ede0c09f4071d5754c"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.firestore();
    const auth = firebase.auth();
    
    const adminUserId = "MvkJo5e1kEcBS0fGGMr4RKdQjYg1"; 
    const appId = 'nail-inventory-app';

    // 1. 更新運費為 65 元
    const SHIPPING_FEE = 65;              
    const FREE_SHIPPING_THRESHOLD = 1000; 
    
    const PROMO_CODES = {
      'VIP9': { type: 'percent', value: 0.9, name: 'VIP 專屬 9 折' },
      'SAVE100': { type: 'minus', value: 100, name: '滿額現折 100 元' },
      'NEWOPEN': { type: 'percent', value: 0.85, name: '歡慶開幕 85 折' },
      'KOL_VIOLA': { type: 'percent', value: 0.95, name: 'Viola 粉絲專屬 95 折' } 
    };

    const NAIL_SHAPES = ['全部', '短橢圓', '中橢圓', '長橢圓', '細狗尖', '杏仁甲', '短圓', '新中方', '短梯', '中梯', '長梯', '超長梯', '長水滴'];

    const { useState, useEffect, useMemo } = React;

    const ProductCard = ({ product, onClick }) => {
      const [mediaIndex, setMediaIndex] = useState(0);

      useEffect(() => {
        let interval;
        if (product.media && product.media.length > 1) {
          interval = setInterval(() => {
            setMediaIndex(prev => (prev + 1) % product.media.length);
          }, 1500);
        }
        return () => clearInterval(interval);
      }, [product.media]);

      return (
        <div 
          onClick={() => onClick(product)}
          className="group bg-white p-3 md:p-4 rounded-[2rem] shadow-sm hover:shadow-2xl transition-all duration-300 border border-gray-100 flex flex-col h-full animate-fade-in-up cursor-pointer overflow-hidden relative"
        >
          <div className="aspect-[4/5] rounded-2xl overflow-hidden bg-gray-50 mb-4 relative flex-shrink-0">
            {product.media && product.media.length > 0 ? (
              product.media.map((m, idx) => (
                m.type === 'video' ? (
                   <video key={idx} src={m.url} className={`absolute inset-0 w-full h-full object-cover transition-opacity duration-300 group-hover:scale-105 ${mediaIndex === idx ? 'opacity-100 z-10' : 'opacity-0 z-0'}`} autoPlay muted loop playsInline />
                ) : (
                   <img key={idx} src={m.url} className={`absolute inset-0 w-full h-full object-cover transition-opacity duration-300 group-hover:scale-105 ${mediaIndex === idx ? 'opacity-100 z-10' : 'opacity-0 z-0'}`} loading="lazy" />
                )
              ))
            ) : (
               <div className="absolute inset-0 flex items-center justify-center text-gray-300 font-bold">無圖片</div>
            )}
            
            {product.shape && <span className="absolute top-3 left-3 z-20 bg-white/95 backdrop-blur-sm text-xs font-bold px-3 py-1.5 rounded-full shadow-sm text-pink-600">{product.shape}</span>}
            
            <div className="absolute inset-0 z-30 bg-black/10 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity duration-300">
               <span className="bg-white text-gray-900 text-sm font-bold px-5 py-2.5 rounded-full shadow-xl transform translate-y-2 group-hover:translate-y-0 transition-all">查看詳情 🔍</span>
            </div>
          </div>
          
          <div className="px-2 flex-1 flex flex-col text-center pb-2">
            <h3 className="font-black text-gray-900 text-lg md:text-xl mb-1 truncate tracking-wide">{product.name}</h3>
            <p className="text-pink-600 font-black text-base md:text-lg mt-auto">NT$ {product.price}</p>
          </div>
        </div>
      );
    };

    function Shop() {
      const [products, setProducts] = useState([]);
      const [visibleCount, setVisibleCount] = useState(8); 
      const [selectedShape, setSelectedShape] = useState('全部');
      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [isLoading, setIsLoading] = useState(true);
      const [isCheckingOut, setIsCheckingOut] = useState(false);
      
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [modalSize, setModalSize] = useState('');
      const [modalQty, setModalQty] = useState(1);
      
      const [fullScreenImage, setFullScreenImage] = useState(null);

      const [user, setUser] = useState(null);
      const [viewMode, setViewMode] = useState('shop'); 
      const [userOrders, setUserOrders] = useState([]);
      const [showScrollTop, setShowScrollTop] = useState(false);

      const [promoInput, setPromoInput] = useState('');
      const [appliedPromo, setAppliedPromo] = useState(null);
      const [customerName, setCustomerName] = useState('');
      const [customerPhone, setCustomerPhone] = useState('');
      const [shippingAddress, setShippingAddress] = useState('');
      const [isGuideOpen, setIsGuideOpen] = useState(false);

      // 支付方式選擇: 'CREDIT' (信用卡), 'CVS' (超商貨到付款/代碼)
      const [paymentMethod, setPaymentMethod] = useState('CREDIT');

      const [repayingOrderId, setRepayingOrderId] = useState(null);

      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        if (params.get('order') === 'success') {
          alert('✅ 訂單已收到！請留意手機簡訊或 Email 通知。');
          setViewMode('orders');
          window.history.replaceState({}, document.title, window.location.pathname);
        }
      }, []);

      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          setUser(currentUser);
          if (currentUser) {
            if(!customerName) setCustomerName(currentUser.displayName || '');
            fetchUserOrders(currentUser.uid);
          }
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if(!adminUserId) return;
        const inventoryRef = db.collection('artifacts').doc(appId).collection('users').doc(adminUserId).collection('inventory');
        const unsubscribe = inventoryRef.onSnapshot((snapshot) => {
          const dbData = snapshot.docs.map(doc => ({ ...doc.data(), docId: doc.id }));
          dbData.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
          setProducts(dbData);
          setIsLoading(false);
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        const handleScroll = () => setShowScrollTop(window.scrollY > 400);
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      useEffect(() => {
        const handleMessage = (event) => {
          if (event.data && event.data.type === 'ECPAY_MAP_RESULT') {
            setShippingAddress(`[超商] ${event.data.storeName} (${event.data.storeAddress})`);
          }
        };
        window.addEventListener('message', handleMessage);
        return () => window.removeEventListener('message', handleMessage);
      }, []);

      const handleLogin = async () => {
        const provider = new firebase.auth.GoogleAuthProvider();
        try { await auth.signInWithPopup(provider); } catch (error) { console.error("Login failed", error); }
      };

      const handleLogout = () => { auth.signOut(); setViewMode('shop'); };

      const fetchUserOrders = (uid) => {
        db.collection('artifacts').doc(appId).collection('users').doc(uid).collection('orders')
          .orderBy('createdAt', 'desc').limit(20)
          .onSnapshot(snapshot => {
            const orders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            setUserOrders(orders);
          });
      };

      const scrollToTop = () => window.scrollTo({ top: 0, behavior: 'smooth' });

      const filteredProducts = useMemo(() => {
        if (selectedShape === '全部') return products;
        return products.filter(p => p.shape === selectedShape);
      }, [products, selectedShape]);

      const handleShapeChange = (shape) => {
        setSelectedShape(shape);
        setVisibleCount(8);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const openProductModal = (product) => {
        setSelectedProduct(product);
        setModalSize('');
        setModalQty(1);
      };

      const handleAddToCart = () => {
        if (!modalSize) { alert('請先選擇尺寸哦！'); return; }
        setCart(prev => {
          const existing = prev.find(item => item.id === selectedProduct.id && item.size === modalSize);
          if (existing) {
            return prev.map(item => item === existing ? { ...item, quantity: item.quantity + modalQty } : item);
          }
          return [...prev, { ...selectedProduct, size: modalSize, quantity: modalQty }];
        });
        setSelectedProduct(null); 
        setIsCartOpen(true);      
      };

      const removeFromCart = (index) => setCart(prev => prev.filter((_, i) => i !== index));

      const cartSubtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      const currentShippingFee = (cartSubtotal === 0 || cartSubtotal >= FREE_SHIPPING_THRESHOLD) ? 0 : SHIPPING_FEE;
      const isFreeShipping = currentShippingFee === 0 && cartSubtotal > 0;
      let promoDiscountAmount = 0;

      if (appliedPromo && cartSubtotal > 0) {
        if (appliedPromo.type === 'percent') { promoDiscountAmount = Math.round(cartSubtotal * (1 - appliedPromo.value)); } 
        else if (appliedPromo.type === 'minus') { promoDiscountAmount = appliedPromo.value; }
      }
      if (cartSubtotal - promoDiscountAmount < 0) promoDiscountAmount = cartSubtotal;

      const finalTotal = cartSubtotal - promoDiscountAmount + currentShippingFee;

      const handleApplyPromo = () => {
        const code = promoInput.toUpperCase().trim();
        if (PROMO_CODES[code]) {
          setAppliedPromo({ ...PROMO_CODES[code], code });
          setPromoInput('');
        } else {
          alert('❌ 無效的折扣碼或已過期');
        }
      };

      const handleOpenMap = (logisticsType) => {
        const mapWindow = window.open(`/api/map?logisticsType=${logisticsType}`, 'ECPayMap', 'width=800,height=600,center=yes');
        if (!mapWindow) {
          alert('請允許瀏覽器開啟彈出視窗以選擇門市！');
        }
      };

      // 🚀 核心結帳邏輯優化
      const handleCheckout = async () => {
        if (!customerName || !customerPhone || !shippingAddress) { 
          alert('請先填寫收件人姓名、電話，並選擇取件門市或地址！'); 
          return; 
        }
        
        setIsCheckingOut(true);
        let tempOrderId = `ORD${Date.now()}`;
        
        try {
          // 確保 Firebase 端紀錄的金額與前端顯示完全一致
          if (user) {
             await db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('orders').doc(tempOrderId).set({
                orderId: tempOrderId,
                items: cart,
                subtotal: cartSubtotal,
                shippingFee: currentShippingFee,
                discount: promoDiscountAmount,
                totalAmount: finalTotal, // 前端計算出的最終應付金額
                customerInfo: { name: customerName, phone: customerPhone, address: shippingAddress },
                promoCode: appliedPromo ? appliedPromo.code : null,
                paymentMethod: paymentMethod,
                status: 'pending',
                createdAt: new Date().toISOString()
             });
          }

          // 2. 傳送資料至後端 API
          // 這裡新增傳送 totalAmount, shippingFee 給後端作為比對，預防金額不符
          const checkoutData = {
            name: customerName,
            phone: customerPhone,
            address: shippingAddress,
            items: cart.map(item => ({
              id: item.id,
              name: item.name,
              price: item.price,
              size: item.size,
              quantity: item.quantity
            })),
            discountCode: appliedPromo ? appliedPromo.code : '',
            orderId: tempOrderId,
            totalAmount: finalTotal,       // 傳送最終總額
            shippingFee: currentShippingFee, // 傳送運費
            paymentMethod: paymentMethod    // 傳送付款方式 (CREDIT 或 CVS)
          };

          const response = await fetch('/api/ecpay', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(checkoutData)
          });
          
          if (!response.ok) {
            const errText = await response.text();
            throw new Error(errText || '結帳連線失敗');
          }
          
          const formHtml = await response.text();
          document.open(); 
          document.write(formHtml); 
          document.close();

        } catch (error) {
          console.error("結帳發生錯誤:", error);
          alert("結帳失敗：" + error.message);
          setIsCheckingOut(false);
        }
      };

      const handleRepay = async (order) => {
        setRepayingOrderId(order.id);
        try {
          const checkoutData = {
            name: order.customerInfo?.name || '',
            phone: order.customerInfo?.phone || '',
            address: order.customerInfo?.address || '',
            items: order.items?.map(item => ({
              id: item.id,
              name: item.name,
              price: item.price,
              size: item.size,
              quantity: item.quantity
            })) || [],
            discountCode: order.promoCode || '',
            orderId: order.orderId,
            totalAmount: order.totalAmount, // 使用訂單紀錄中的金額
            shippingFee: order.shippingFee || 65,
            paymentMethod: order.paymentMethod || 'CREDIT'
          };

          const response = await fetch('/api/ecpay', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(checkoutData)
          });
          
          if (!response.ok) throw new Error('結帳連線失敗');
          const formHtml = await response.text();
          document.open(); 
          document.write(formHtml); 
          document.close();
        } catch (error) {
          alert("重新付款失敗：" + error.message);
        } finally {
          setRepayingOrderId(null);
        }
      };

      return (
        <div className="min-h-screen relative pb-20">
          <div className="bg-[#e8dad2] text-gray-800 text-[11px] md:text-xs py-1.5 px-5 flex justify-center font-bold tracking-widest uppercase relative z-50">
             聯絡我們 : viola.lomography@gmail.com
          </div>

          <header className="bg-white/95 backdrop-blur-md sticky top-0 z-40 border-b border-gray-100 shadow-sm">
            <div className="max-w-6xl mx-auto px-4 md:px-5 py-3 md:py-4 flex justify-between items-center">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setViewMode('shop')}>
                <img 
                  src="freepik__logo__19488.png" 
                  onError={(e) => { e.target.onerror = null; e.target.src = 'https://ui-avatars.com/api/?name=指尖造藝&background=FDF2F8&color=DB2777&rounded=true&bold=true'; }}
                  alt="指尖造藝 Logo" 
                  className="w-10 h-10 md:w-12 md:h-12 rounded-full object-cover shadow-sm border border-pink-100 bg-white" 
                />
                <h1 className="text-xl md:text-2xl font-black tracking-widest text-gray-900 hidden sm:block">指尖造藝</h1>
              </div>

              <div className="flex items-center gap-2 md:gap-4">
                <button onClick={() => setIsGuideOpen(true)} className="text-xs md:text-sm font-bold text-gray-500 hover:text-pink-500 bg-gray-50 px-3 py-2 rounded-full shadow-sm border border-gray-100 transition">
                  📏 教學
                </button>

                {user ? (
                  <div className="relative group">
                    <button className="flex items-center gap-2 bg-gray-50 hover:bg-gray-100 px-3 py-1.5 rounded-full transition border border-gray-100">
                      <img src={user.photoURL || 'https://ui-avatars.com/api/?name=U'} className="w-7 h-7 rounded-full" />
                      <span className="text-sm font-bold text-gray-700 hidden md:inline">{user.displayName?.split(' ')[0] || '會員'}</span>
                    </button>
                    <div className="absolute right-0 mt-2 w-32 bg-white rounded-xl shadow-xl border border-gray-100 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 py-2">
                      <button onClick={() => setViewMode('orders')} className="w-full text-left px-4 py-2 text-sm font-bold text-gray-700 hover:text-pink-600 hover:bg-pink-50">📋 我的訂單</button>
                      <button onClick={handleLogout} className="w-full text-left px-4 py-2 text-sm font-bold text-gray-700 hover:text-red-600 hover:bg-red-50">登出</button>
                    </div>
                  </div>
                ) : (
                  <button onClick={handleLogin} className="text-xs md:text-sm font-bold text-white bg-gray-900 px-4 py-2 rounded-full hover:bg-pink-600 transition shadow-sm">
                    登入 / 註冊
                  </button>
                )}

                <button onClick={() => setIsCartOpen(true)} className="relative p-2 flex items-center gap-2 font-bold text-gray-700 hover:text-pink-500 transition-colors bg-white rounded-full">
                  <span className="text-xl">🛒</span> 
                  {cart.length > 0 && (
                    <span className="absolute -top-1 -right-1 bg-pink-500 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center shadow-md animate-bounce">
                      {cart.length}
                    </span>
                  )}
                </button>
              </div>
            </div>
          </header>

          {viewMode === 'shop' && (
            <div className="sticky top-[60px] md:top-[76px] z-30 bg-white/95 backdrop-blur-md shadow-sm border-b border-gray-100 py-3 px-4">
              <div className="max-w-6xl mx-auto overflow-x-auto hide-scrollbar">
                <div className="flex gap-2 w-max">
                  {NAIL_SHAPES.map(shape => (
                    <button
                      key={shape}
                      onClick={() => handleShapeChange(shape)}
                      className={`px-4 py-1.5 rounded-full text-sm font-bold whitespace-nowrap transition-all duration-300 ${
                        selectedShape === shape
                          ? 'bg-pink-500 text-white shadow-md'
                          : 'bg-gray-50 text-gray-600 border border-gray-200 hover:bg-pink-50 hover:text-pink-500'
                      }`}
                    >
                      {shape}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          <main className="max-w-6xl mx-auto px-4 py-8">
            {viewMode === 'shop' ? (
                // 商品列表 (略，同原版)
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 md:gap-8">
                {isLoading ? (
                    <div className="col-span-full text-center py-20 text-gray-400 font-bold">載入中...</div>
                ) : filteredProducts.slice(0, visibleCount).map(product => (
                    <ProductCard key={product.id} product={product} onClick={openProductModal} />
                ))}
                </div>
            ) : (
              // 我的訂單
              <div className="max-w-3xl mx-auto animate-fade-in-up">
                <div className="flex items-center gap-4 mb-8">
                  <button onClick={() => setViewMode('shop')} className="text-gray-500 hover:text-gray-900 bg-white w-10 h-10 rounded-full shadow-sm flex items-center justify-center font-bold">←</button>
                  <h2 className="text-2xl font-black text-gray-900">📦 我的訂單</h2>
                </div>
                {userOrders.length === 0 ? (
                  <div className="bg-white p-10 rounded-3xl text-center border border-gray-100 shadow-sm">
                    <div className="text-5xl mb-4">📜</div>
                    <h3 className="text-xl font-bold text-gray-700 mb-2">您還沒有購買過任何商品</h3>
                  </div>
                ) : (
                  <div className="space-y-6">
                    {userOrders.map(order => (
                      <div key={order.id} className="bg-white rounded-3xl p-6 border border-gray-100 shadow-sm">
                        <div className="flex justify-between items-start border-b border-gray-100 pb-4 mb-4">
                          <div>
                            <span className="text-xs text-gray-400 font-bold block mb-1">{new Date(order.createdAt).toLocaleString()}</span>
                            <span className="text-sm font-bold text-gray-800 bg-gray-100 px-3 py-1 rounded-lg">單號: {order.orderId}</span>
                          </div>
                          <div className="flex flex-col items-end gap-2">
                            <div className={`px-4 py-1.5 rounded-full text-sm font-bold ${
                              order.status === 'pending' ? 'bg-amber-100 text-amber-700' : 'bg-green-100 text-green-700'
                            }`}>
                              {order.status === 'pending' ? '⏳ 未付款/處理中' : '✅ 已完成'}
                            </div>
                            {order.status === 'pending' && (
                              <button onClick={() => handleRepay(order)} disabled={repayingOrderId === order.id} className="text-xs bg-pink-500 text-white px-4 py-2 rounded-full font-bold">
                                {repayingOrderId === order.id ? '跳轉中...' : '💳 重新付款'}
                              </button>
                            )}
                          </div>
                        </div>
                        <div className="bg-gray-50 rounded-xl p-4 flex justify-between items-center">
                          <div className="text-xs text-gray-500">應付總金額</div>
                          <div className="text-right font-black text-xl text-pink-600">NT$ {order.totalAmount}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </main>

          {/* 購物車 Modal 優化部分 */}
          {isCartOpen && (
            <div className="fixed inset-0 z-[60] flex justify-end">
              <div className="absolute inset-0 bg-black/40 backdrop-blur-sm" onClick={() => setIsCartOpen(false)}></div>
              <div className="w-full max-w-md bg-white h-full relative flex flex-col shadow-2xl animate-fade-in-right">
                <div className="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                  <h2 className="text-xl font-black">🛍️ 購物車清單</h2>
                  <button onClick={() => setIsCartOpen(false)} className="font-bold text-gray-600">✕</button>
                </div>
                
                <div className="flex-1 overflow-y-auto p-6 space-y-6">
                  {cart.map((item, idx) => (
                    <div key={idx} className="flex gap-4 border-b border-gray-100 pb-4">
                      <img src={item.media?.[0]?.url} className="w-16 h-20 object-cover rounded-xl" />
                      <div className="flex-1">
                        <h4 className="font-bold">{item.name}</h4>
                        <div className="text-xs text-gray-500">尺寸: {item.size} / 數量: {item.quantity}</div>
                        <div className="text-pink-600 font-bold mt-1">NT$ {item.price * item.quantity}</div>
                      </div>
                      <button onClick={() => removeFromCart(idx)} className="text-red-300 hover:text-red-500">✕</button>
                    </div>
                  ))}

                  {cart.length > 0 && (
                    <div className="space-y-4">
                      <div className="bg-white border-2 border-gray-100 p-4 rounded-2xl">
                        <h3 className="font-bold mb-3">📦 收件資訊</h3>
                        <input type="text" placeholder="真實姓名" value={customerName} onChange={e => setCustomerName(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm mb-2" />
                        <input type="tel" placeholder="手機號碼" value={customerPhone} onChange={e => setCustomerPhone(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm mb-2" />
                        
                        <div className="flex gap-2 mb-2">
                          <button onClick={() => handleOpenMap('UNIMARTC2C')} className="flex-1 bg-green-50 text-green-700 py-2 rounded-xl text-xs font-bold border border-green-200">🏪 7-11 門市</button>
                          <button onClick={() => handleOpenMap('FAMIC2C')} className="flex-1 bg-blue-50 text-blue-700 py-2 rounded-xl text-xs font-bold border border-blue-200">🏪 全家 門市</button>
                        </div>
                        <textarea placeholder="填寫地址或使用上方按鈕選擇門市" value={shippingAddress} onChange={e => setShippingAddress(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-pink-200 text-sm font-bold text-pink-700 h-16"></textarea>
                      </div>

                      <div className="bg-gray-50 p-4 rounded-2xl">
                        <h3 className="font-bold text-sm mb-3">💳 支付方式</h3>
                        <div className="grid grid-cols-2 gap-2">
                           <button onClick={() => setPaymentMethod('CREDIT')} className={`py-2 rounded-xl text-xs font-bold border transition ${paymentMethod === 'CREDIT' ? 'bg-gray-900 text-white' : 'bg-white text-gray-600 border-gray-200'}`}>信用卡支付</button>
                           <button onClick={() => setPaymentMethod('CVS')} className={`py-2 rounded-xl text-xs font-bold border transition ${paymentMethod === 'CVS' ? 'bg-gray-900 text-white' : 'bg-white text-gray-600 border-gray-200'}`}>超商貨到付款/代碼</button>
                        </div>
                        <p className="text-[10px] text-gray-400 mt-2">* 選擇超商貨到付款請務必填寫正確門市。</p>
                      </div>
                    </div>
                  )}
                </div>

                <div className="p-6 bg-white border-t border-gray-100">
                  <div className="space-y-2 mb-4 text-sm font-bold text-gray-500">
                    <div className="flex justify-between"><span>小計</span><span>NT$ {cartSubtotal}</span></div>
                    {promoDiscountAmount > 0 && <div className="flex justify-between text-pink-500"><span>折扣</span><span>- NT$ {promoDiscountAmount}</span></div>}
                    <div className="flex justify-between"><span>運費</span>{isFreeShipping ? <span className="text-green-500">免運</span> : <span>NT$ {currentShippingFee}</span>}</div>
                    <div className="flex justify-between items-center pt-3 border-t mt-2"><span className="text-gray-900 text-base">總計</span><span className="text-3xl font-black text-pink-600">NT$ {finalTotal}</span></div>
                  </div>
                  <button 
                    disabled={cart.length === 0 || isCheckingOut} onClick={handleCheckout}
                    className="w-full bg-gray-900 text-white py-4 rounded-2xl font-black text-lg hover:bg-pink-600 transition-all shadow-xl disabled:bg-gray-200"
                  >
                    {isCheckingOut ? '處理中...' : '確認結帳 💳'}
                  </button>
                </div>
              </div>
            </div>
          )}
          
          {/* 其他 Modal (教學、放大) 同原版，此處省略以保持簡潔 */}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Shop />);
  </script>
</body>
</html>
