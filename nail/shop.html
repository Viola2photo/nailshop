<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>指尖造藝 - 專屬穿戴甲</title>
  
  <!-- Tailwind & React & Babel -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script defer crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-[#FAF9F8] text-gray-800 font-sans">
  
  <div id="root">
    <style>
      .preloader { position: fixed; inset: 0; background-color: #FAF9F8; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
      .preloader-spinner { width: 50px; height: 50px; border: 4px solid rgba(236, 72, 153, 0.1); border-left-color: #ec4899; border-radius: 50%; animation: spin 1s linear infinite; }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      .preloader-text { margin-top: 16px; color: #9ca3af; font-family: sans-serif; font-weight: bold; font-size: 14px; letter-spacing: 2px; }
      .hide-scrollbar::-webkit-scrollbar { display: none; }
      .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      html { scroll-behavior: smooth; }
      /* 修正自動切換時的過渡感 */
      .fade-media { transition: opacity 0.3s ease-in-out; }
    </style>
    <div class="preloader">
      <div class="preloader-spinner"></div>
      <div class="preloader-text">載入中...</div>
    </div>
  </div>

  <script type="text/babel">
    const firebaseConfig = {
      apiKey: "AIzaSyDQZGeeubB8bEUL59v9yt0QBAfIWJcvgnw",
      authDomain: "nailproject-40022.firebaseapp.com",
      projectId: "nailproject-40022",
      storageBucket: "nailproject-40022.firebasestorage.app",
      messagingSenderId: "1004628981925",
      appId: "1:1004628981925:web:db01ede0c09f4071d5754c"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.firestore();
    const auth = firebase.auth();
    
    const adminUserId = "MvkJo5e1kEcBS0fGGMr4RKdQjYg1"; 
    const appId = 'nail-inventory-app';

    const SHIPPING_FEE = 65;              
    const FREE_SHIPPING_THRESHOLD = 1000; 
    
    const PROMO_CODES = {
      'VIP9': { type: 'percent', value: 0.9, name: 'VIP 專屬 9 折' },
      'SAVE100': { type: 'minus', value: 100, name: '滿額現折 100 元' },
      'NEWOPEN': { type: 'percent', value: 0.85, name: '歡慶開幕 85 折' },
      'KOL_VIOLA': { type: 'percent', value: 0.95, name: 'Viola 粉絲專屬 95 折' } 
    };

    const NAIL_SHAPES = ['全部', '短橢圓', '中橢圓', '長橢圓', '細狗尖', '杏仁甲', '短圓', '新中方', '短梯', '中梯', '長梯', '超長梯', '長水滴'];

    const { useState, useEffect, useMemo } = React;

    // --- 商品卡片 (0.5秒自動輪播) ---
    const ProductCard = ({ product, onClick }) => {
      const [mediaIndex, setMediaIndex] = useState(0);

      useEffect(() => {
        let interval;
        if (product.media && product.media.length > 1) {
          interval = setInterval(() => {
            setMediaIndex(prev => (prev + 1) % product.media.length);
          }, 500);
        }
        return () => clearInterval(interval);
      }, [product.media]);

      return (
        <div 
          onClick={() => onClick(product)}
          className="group bg-white p-3 md:p-4 rounded-[2rem] shadow-sm hover:shadow-2xl transition-all duration-300 border border-gray-100 flex flex-col h-full animate-fade-in-up cursor-pointer overflow-hidden relative"
        >
          <div className="aspect-[4/5] rounded-2xl overflow-hidden bg-gray-50 mb-4 relative flex-shrink-0">
            {product.media && product.media.length > 0 ? (
              product.media.map((m, idx) => (
                m.type === 'video' ? (
                   <video key={idx} src={m.url} className={`absolute inset-0 w-full h-full object-cover fade-media group-hover:scale-105 ${mediaIndex === idx ? 'opacity-100 z-10' : 'opacity-0 z-0'}`} autoPlay muted loop playsInline />
                ) : (
                   <img key={idx} src={m.url} className={`absolute inset-0 w-full h-full object-cover fade-media group-hover:scale-105 ${mediaIndex === idx ? 'opacity-100 z-10' : 'opacity-0 z-0'}`} loading="lazy" />
                )
              ))
            ) : (
               <div className="absolute inset-0 flex items-center justify-center text-gray-300 font-bold">無圖片</div>
            )}
            
            {product.shape && <span className="absolute top-3 left-3 z-20 bg-white/95 backdrop-blur-sm text-[10px] md:text-xs font-bold px-3 py-1.5 rounded-full shadow-sm text-pink-600">{product.shape}</span>}
            
            <div className="absolute inset-0 z-30 bg-black/10 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity duration-300">
               <span className="bg-white text-gray-900 text-sm font-bold px-5 py-2.5 rounded-full shadow-xl transform translate-y-2 group-hover:translate-y-0 transition-all">查看詳情 🔍</span>
            </div>
          </div>
          
          <div className="px-2 flex-1 flex flex-col text-center pb-2">
            <h3 className="font-black text-gray-900 text-lg md:text-xl mb-1 truncate tracking-wide">{product.name}</h3>
            <p className="text-pink-600 font-black text-base md:text-lg mt-auto">NT$ {product.price}</p>
          </div>
        </div>
      );
    };

    function Shop() {
      const [products, setProducts] = useState([]);
      const [visibleCount, setVisibleCount] = useState(8); 
      const [selectedShape, setSelectedShape] = useState('全部');
      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [isLoading, setIsLoading] = useState(true);
      const [isCheckingOut, setIsCheckingOut] = useState(false);
      
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [modalSize, setModalSize] = useState('');
      const [modalQty, setModalQty] = useState(1);
      const [fullScreenImage, setFullScreenImage] = useState(null);

      const [user, setUser] = useState(null);
      const [viewMode, setViewMode] = useState('shop'); 
      const [userOrders, setUserOrders] = useState([]);
      const [showScrollTop, setShowScrollTop] = useState(false);

      const [promoInput, setPromoInput] = useState('');
      const [appliedPromo, setAppliedPromo] = useState(null);
      const [customerName, setCustomerName] = useState('');
      const [customerPhone, setCustomerPhone] = useState('');
      const [shippingAddress, setShippingAddress] = useState('');
      const [isGuideOpen, setIsGuideOpen] = useState(false);

      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          setUser(currentUser);
          if (currentUser) {
            if(!customerName) setCustomerName(currentUser.displayName || '');
            fetchUserOrders(currentUser.uid);
          }
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if(!adminUserId) return;
        const inventoryRef = db.collection('artifacts').doc(appId).collection('users').doc(adminUserId).collection('inventory');
        const unsubscribe = inventoryRef.onSnapshot((snapshot) => {
          const dbData = snapshot.docs.map(doc => ({ ...doc.data(), docId: doc.id }));
          dbData.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
          setProducts(dbData);
          setIsLoading(false);
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        const handleScroll = () => setShowScrollTop(window.scrollY > 400);
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      // 💡 地圖回傳監聽 (連動 map-reply.js)
      useEffect(() => {
        const handleMessage = (event) => {
          if (event.data && event.data.type === 'ECPAY_MAP_RESULT') {
            const { storeName, storeAddress } = event.data;
            setShippingAddress(`[${storeName}] ${storeAddress}`);
          }
        };
        window.addEventListener('message', handleMessage);
        return () => window.removeEventListener('message', handleMessage);
      }, []);

      const handleLogin = async () => {
        const provider = new firebase.auth.GoogleAuthProvider();
        try { await auth.signInWithPopup(provider); } catch (error) { console.error("Login failed", error); }
      };

      const handleLogout = () => { auth.signOut(); setViewMode('shop'); };

      const fetchUserOrders = (uid) => {
        db.collection('artifacts').doc(appId).collection('users').doc(uid).collection('orders')
          .orderBy('createdAt', 'desc').limit(20)
          .onSnapshot(snapshot => {
            const orders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            setUserOrders(orders);
          });
      };

      const scrollToTop = () => window.scrollTo({ top: 0, behavior: 'smooth' });

      const filteredProducts = useMemo(() => {
        if (selectedShape === '全部') return products;
        return products.filter(p => p.shape === selectedShape);
      }, [products, selectedShape]);

      const handleShapeChange = (shape) => {
        setSelectedShape(shape);
        setVisibleCount(8);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const openProductModal = (product) => {
        setSelectedProduct(product);
        setModalSize('');
        setModalQty(1);
      };

      const handleAddToCart = () => {
        if (!modalSize) { alert('請先選擇尺寸哦！'); return; }
        setCart(prev => {
          const existing = prev.find(item => item.id === selectedProduct.id && item.size === modalSize);
          if (existing) {
            return prev.map(item => item === existing ? { ...item, quantity: item.quantity + modalQty } : item);
          }
          return [...prev, { ...selectedProduct, size: modalSize, quantity: modalQty }];
        });
        setSelectedProduct(null); 
        setIsCartOpen(true);      
      };

      const removeFromCart = (index) => setCart(prev => prev.filter((_, i) => i !== index));

      const cartSubtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      const currentShippingFee = (cartSubtotal === 0 || cartSubtotal >= FREE_SHIPPING_THRESHOLD) ? 0 : SHIPPING_FEE;
      const isFreeShipping = currentShippingFee === 0 && cartSubtotal > 0;
      let promoDiscountAmount = 0;

      if (appliedPromo && cartSubtotal > 0) {
        if (appliedPromo.type === 'percent') { promoDiscountAmount = Math.round(cartSubtotal * (1 - appliedPromo.value)); } 
        else if (appliedPromo.type === 'minus') { promoDiscountAmount = appliedPromo.value; }
      }
      if (cartSubtotal - promoDiscountAmount < 0) promoDiscountAmount = cartSubtotal;

      const finalTotal = cartSubtotal - promoDiscountAmount + currentShippingFee;

      const handleApplyPromo = () => {
        const code = promoInput.toUpperCase().trim();
        if (PROMO_CODES[code]) {
          setAppliedPromo({ ...PROMO_CODES[code], code });
          setPromoInput('');
        } else {
          alert('❌ 無效的折扣碼或已過期');
        }
      };

      const handleCheckout = async () => {
        if (!customerName || !customerPhone || !shippingAddress) { alert('請填寫完整資訊並選擇取件門市！'); return; }
        setIsCheckingOut(true);
        try {
          const orderItems = cart.map(item => ({
            id: item.id,
            name: item.name,
            size: item.size,
            quantity: item.quantity,
            price: item.price
          }));

          let orderId = `ORD${Date.now()}`;
          
          if (user) {
             await db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('orders').doc(orderId).set({
                orderId: orderId,
                items: orderItems,
                totalAmount: finalTotal,
                customerInfo: { name: customerName, phone: customerPhone, address: shippingAddress },
                promoCode: appliedPromo ? appliedPromo.code : null,
                status: 'pending',
                createdAt: new Date().toISOString()
             });
          }

          // 💡 呼叫 API 進入綠界結帳
          const response = await fetch('/api/ecpay', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
              orderId: orderId,
              items: orderItems,
              promoCode: appliedPromo ? appliedPromo.code : null,
              customerInfo: { name: customerName, phone: customerPhone, address: shippingAddress },
              total: finalTotal 
            }) 
          });
          
          if (!response.ok) throw new Error('結帳連線失敗');
          const html = await response.text();
          document.open(); document.write(html); document.close();

        } catch(e) {
          console.error(e);
          alert('【系統提示】因為目前尚無實體結帳後端，模擬訂單已存入您的帳戶。');
          setCart([]); setIsCartOpen(false); setViewMode('orders'); setIsCheckingOut(false);
        }
      };

      return (
        <div className="min-h-screen relative pb-20">
          <div className="bg-[#e8dad2] text-gray-800 text-[11px] md:text-xs py-1.5 px-5 flex justify-center font-bold tracking-widest uppercase relative z-50">
             聯絡我們 : viola.lomography@gmail.com
          </div>

          {/* Header */}
          <header className="bg-white/95 backdrop-blur-md sticky top-0 z-40 border-b border-gray-100 shadow-sm">
            <div className="max-w-6xl mx-auto px-4 md:px-5 py-3 md:py-4 flex justify-between items-center">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setViewMode('shop')}>
                <img 
                  src="freepik__logo__19488.png" 
                  onError={(e) => { e.target.onerror = null; e.target.src = 'https://ui-avatars.com/api/?name=指尖造藝&background=FDF2F8&color=DB2777&rounded=true&bold=true'; }}
                  alt="Logo" className="w-10 h-10 md:w-12 md:h-12 rounded-full object-cover border border-pink-100" 
                />
                <h1 className="text-xl md:text-2xl font-black tracking-widest text-gray-900 hidden sm:block">指尖造藝</h1>
              </div>

              <div className="flex items-center gap-2 md:gap-4">
                <button onClick={() => setIsGuideOpen(true)} className="text-xs md:text-sm font-bold text-gray-500 hover:text-pink-500 bg-gray-50 px-3 py-2 rounded-full shadow-sm border border-gray-100">
                  📏 教學
                </button>

                {user ? (
                  <div className="relative group">
                    <button className="flex items-center gap-2 bg-gray-50 hover:bg-gray-100 px-3 py-1.5 rounded-full transition border border-gray-100">
                      <img src={user.photoURL || 'https://ui-avatars.com/api/?name=U'} className="w-7 h-7 rounded-full" />
                      <span className="text-sm font-bold text-gray-700 hidden md:inline">{user.displayName?.split(' ')[0]}</span>
                    </button>
                    <div className="absolute right-0 mt-2 w-32 bg-white rounded-xl shadow-xl border border-gray-100 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 py-2">
                      <button onClick={() => setViewMode('orders')} className="w-full text-left px-4 py-2 text-sm font-bold text-gray-700 hover:text-pink-600 hover:bg-pink-50">📋 我的訂單</button>
                      <button onClick={handleLogout} className="w-full text-left px-4 py-2 text-sm font-bold text-gray-700 hover:text-red-600 hover:bg-red-50">登出</button>
                    </div>
                  </div>
                ) : (
                  <button onClick={handleLogin} className="text-xs md:text-sm font-bold text-white bg-gray-900 px-4 py-2 rounded-full hover:bg-pink-600 transition shadow-sm">
                    登入 / 註冊
                  </button>
                )}

                <button onClick={() => setIsCartOpen(true)} className="relative p-2 flex items-center gap-2 font-bold text-gray-700 hover:text-pink-500 transition-colors bg-white rounded-full">
                  <span className="text-xl">🛒</span> 
                  {cart.length > 0 && <span className="absolute -top-1 -right-1 bg-pink-500 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center animate-bounce">{cart.length}</span>}
                </button>
              </div>
            </div>
          </header>

          {/* 分類吸頂 */}
          {viewMode === 'shop' && (
            <div className="sticky top-[60px] md:top-[76px] z-30 bg-white/95 backdrop-blur-md shadow-sm border-b border-gray-100 py-3 px-4">
              <div className="max-w-6xl mx-auto overflow-x-auto hide-scrollbar">
                <div className="flex gap-2 w-max">
                  {NAIL_SHAPES.map(shape => (
                    <button
                      key={shape}
                      onClick={() => handleShapeChange(shape)}
                      className={`px-4 py-1.5 rounded-full text-sm font-bold whitespace-nowrap transition-all duration-300 ${
                        selectedShape === shape ? 'bg-pink-500 text-white shadow-md' : 'bg-gray-50 text-gray-600 border border-gray-200'
                      }`}
                    >
                      {shape}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          <main className="max-w-6xl mx-auto px-4 py-8">
            {viewMode === 'shop' ? (
              isLoading ? <div className="text-center py-20 text-gray-400 font-bold">載入款式中...</div> : (
                <>
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 md:gap-8">
                    {filteredProducts.slice(0, visibleCount).map(product => (
                      <ProductCard key={product.id} product={product} onClick={openProductModal} />
                    ))}
                  </div>
                  {visibleCount < filteredProducts.length && (
                    <div className="mt-12 flex justify-center">
                      <button onClick={() => setVisibleCount(prev => prev + 8)} className="px-8 py-3 bg-white border-2 border-pink-200 text-pink-600 rounded-full font-bold shadow-sm">載入更多商品 👇</button>
                    </div>
                  )}
                </>
              )
            ) : (
              // 歷史訂單
              <div className="max-w-3xl mx-auto animate-fade-in-up">
                 <h2 className="text-2xl font-black text-gray-900 mb-8 flex items-center gap-4">
                    <button onClick={() => setViewMode('shop')} className="text-gray-400">←</button> 📦 我的訂單
                 </h2>
                 {userOrders.length === 0 ? <p className="text-center py-20 text-gray-400">尚無購買記錄</p> : (
                   <div className="space-y-6">
                     {userOrders.map(order => (
                       <div key={order.id} className="bg-white rounded-3xl p-6 border border-gray-100 shadow-sm">
                          <div className="flex justify-between items-center mb-4 pb-4 border-b border-gray-50">
                             <span className="text-xs text-gray-400 font-bold">{new Date(order.createdAt).toLocaleString()}</span>
                             <span className="bg-pink-50 text-pink-600 text-[10px] px-2 py-1 rounded-md font-bold">{order.status}</span>
                          </div>
                          {order.items?.map((item, idx) => (
                             <div key={idx} className="flex justify-between items-center text-sm mb-2 font-bold">
                                <span>{item.name} ({item.size}) x{item.quantity}</span>
                                <span>NT$ {item.price * item.quantity}</span>
                             </div>
                          ))}
                          <div className="mt-4 pt-4 border-t border-gray-50 text-right">
                             <span className="text-xs text-gray-400 block">總金額</span>
                             <span className="text-xl font-black text-pink-600">NT$ {order.totalAmount}</span>
                          </div>
                       </div>
                     ))}
                   </div>
                 )}
              </div>
            )}
          </main>

          <button onClick={scrollToTop} className={`fixed bottom-6 right-6 z-40 bg-pink-500 text-white w-12 h-12 rounded-full shadow-lg flex items-center justify-center text-xl transition-all duration-300 ${showScrollTop ? 'opacity-100' : 'opacity-0'}`}>🚀</button>

          {/* 商品預覽 Modal */}
          {selectedProduct && (
            <div className="fixed inset-0 z-40 flex items-center justify-center p-4">
              <div className="absolute inset-0 bg-black/70 backdrop-blur-sm" onClick={() => setSelectedProduct(null)}></div>
              <div className="bg-white rounded-[2rem] w-full max-w-4xl max-h-[90vh] overflow-y-auto relative z-50 shadow-2xl flex flex-col md:flex-row animate-fade-in-up">
                <button onClick={() => setSelectedProduct(null)} className="absolute top-4 right-4 w-10 h-10 flex items-center justify-center bg-white/80 rounded-full font-bold z-20">✕</button>
                <div className="w-full md:w-1/2 shrink-0 bg-gray-50 flex overflow-x-auto snap-x snap-mandatory hide-scrollbar">
                  {selectedProduct.media?.map((m, idx) => (
                    <img key={idx} src={m.url} onClick={() => setFullScreenImage(m.url)} className="w-full flex-shrink-0 snap-center object-cover cursor-zoom-in" />
                  ))}
                </div>
                <div className="w-full md:w-1/2 p-6 md:p-10 flex flex-col">
                  <h2 className="text-2xl md:text-3xl font-black text-gray-900 mb-2">{selectedProduct.name}</h2>
                  <p className="text-3xl font-black text-pink-600 mb-6">NT$ {selectedProduct.price}</p>
                  <div className="mb-6 bg-gray-50 p-5 rounded-2xl text-sm leading-relaxed">{selectedProduct.description}</div>
                  <div className="mb-6">
                    <h3 className="font-bold text-gray-900 text-lg mb-3">選擇尺寸</h3>
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                      {['XS', 'S', 'M', 'L'].map(size => {
                        const inStock = selectedProduct.stock[size] > 0;
                        return (
                          <button key={size} disabled={!inStock} onClick={() => setModalSize(size)} className={`py-3 rounded-xl border-2 flex flex-col items-center justify-center transition-all ${modalSize === size ? 'border-pink-500 bg-pink-50 text-pink-600' : 'border-gray-100 opacity-40'}`}>
                            <span className="font-black text-lg">{size}</span>
                            {inStock && size === 'S' && <span className="text-[9px] font-bold">熱門首選</span>}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                  <button onClick={handleAddToCart} className="mt-auto w-full bg-gray-900 text-white py-4 rounded-2xl font-black text-lg hover:bg-pink-600 shadow-xl">加入購物車 🛒</button>
                </div>
              </div>
            </div>
          )}

          {/* 全螢幕放大 */}
          {fullScreenImage && (
            <div className="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-black/95 animate-fade-in-up" onClick={() => setFullScreenImage(null)}>
               <img src={fullScreenImage} className="max-w-full max-h-[90vh] object-contain" />
            </div>
          )}

          {/* 🛒 購物車側欄 */}
          {isCartOpen && (
            <div className="fixed inset-0 z-[60] flex justify-end">
              <div className="absolute inset-0 bg-black/40 backdrop-blur-sm" onClick={() => setIsCartOpen(false)}></div>
              <div className="w-full max-w-md bg-white h-full relative flex flex-col shadow-2xl animate-fade-in-right">
                <div className="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                  <h2 className="text-xl font-black">🛍️ 購物車清單</h2>
                  <button onClick={() => setIsCartOpen(false)} className="w-8 h-8 flex items-center justify-center bg-gray-200 rounded-full font-bold">✕</button>
                </div>
                <div className="flex-1 overflow-y-auto p-6 space-y-6">
                  {cart.length === 0 ? <p className="text-center py-20 text-gray-400 font-bold">購物車是空的喔</p> : (
                    <>
                      {cart.map((item, idx) => (
                        <div key={idx} className="flex gap-4 border-b border-gray-100 pb-6">
                          <img src={item.media?.[0]?.url} className="w-20 h-24 object-cover rounded-xl" />
                          <div className="flex-1">
                            <div className="flex justify-between items-start">
                              <h4 className="font-bold text-gray-900">{item.name}</h4>
                              <button onClick={() => removeFromCart(idx)} className="text-red-400 text-xs font-bold">移除</button>
                            </div>
                            <span className="text-xs text-gray-500 block mt-1">尺寸：{item.size} / 數量：{item.quantity}</span>
                            <span className="font-black text-pink-600 block mt-1">NT$ {item.price * item.quantity}</span>
                          </div>
                        </div>
                      ))}
                      <div className="bg-white border-2 border-gray-100 p-4 rounded-2xl shadow-sm">
                        <h3 className="font-bold text-gray-900 text-base mb-3 border-b pb-2 tracking-wide">📦 收件資訊</h3>
                        <input type="text" placeholder="真實姓名 (取貨核對)" value={customerName} onChange={e => setCustomerName(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm mb-3" />
                        <input type="tel" placeholder="手機號碼" value={customerPhone} onChange={e => setCustomerPhone(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm mb-3" />
                        <textarea placeholder="點擊下方地圖選擇門市" value={shippingAddress} readOnly className="w-full px-4 py-3 rounded-xl border border-pink-200 text-sm font-bold text-pink-700 bg-pink-50 h-16 mb-2"></textarea>
                        
                        {/* 💡 修正地圖連結：指向 /api/map */}
                        <button onClick={() => window.open('/api/map?logisticsType=UNIMART', 'ecpay_map', 'width=800,height=600')} className="w-full py-2.5 bg-pink-100 text-pink-600 rounded-xl text-xs font-bold hover:bg-pink-200 transition-colors">🗺️ 開啟超商地圖選擇門市</button>
                      </div>
                      <div className="bg-gray-50 p-4 rounded-2xl shadow-sm">
                        <h3 className="font-bold text-gray-700 text-sm mb-2 tracking-wide">🎁 折扣碼</h3>
                        <div className="flex gap-2">
                           <input type="text" placeholder="輸入代碼" value={promoInput} onChange={e => setPromoInput(e.target.value)} className="flex-1 px-4 py-2 rounded-xl border border-gray-200 text-sm uppercase" />
                           <button onClick={handleApplyPromo} className="bg-pink-500 text-white px-4 py-2 rounded-xl font-bold text-sm">套用</button>
                        </div>
                        {appliedPromo && <div className="mt-2 text-xs font-bold text-green-600">✅ 已套用：{appliedPromo.name}</div>}
                      </div>
                    </>
                  )}
                </div>
                <div className="p-6 bg-white border-t border-gray-100 shadow-sm">
                  <div className="space-y-2 mb-6 text-sm font-bold text-gray-500">
                    <div className="flex justify-between"><span>商品小計</span><span>NT$ {cartSubtotal}</span></div>
                    {promoDiscountAmount > 0 && <div className="flex justify-between text-pink-500"><span>折扣折抵</span><span>- NT$ {promoDiscountAmount}</span></div>}
                    <div className="flex justify-between"><span>物流運費</span><span>{isFreeShipping ? '免運' : `NT$ ${currentShippingFee}`}</span></div>
                    <div className="flex justify-between items-center pt-3 border-t border-gray-100 mt-2"><span className="text-gray-900 text-base font-black tracking-widest">結帳總計</span><span className="text-3xl font-black text-pink-600">NT$ {finalTotal}</span></div>
                  </div>
                  <button disabled={cart.length === 0 || isCheckingOut} onClick={handleCheckout} className="w-full bg-gray-900 text-white py-4 rounded-2xl font-black text-lg hover:bg-gray-800 disabled:opacity-50 shadow-xl transition-all active:scale-[0.98]">
                    {isCheckingOut ? '處理中...' : '前往結帳 💳'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 📏 恢復教學 Modal (測量/穿戴/製作) */}
          {isGuideOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
              <div className="absolute inset-0 bg-black/50 backdrop-blur-sm" onClick={() => setIsGuideOpen(false)}></div>
              <div className="bg-white rounded-3xl w-full max-w-2xl max-h-[85vh] overflow-y-auto relative z-10 shadow-2xl p-6 md:p-10 animate-fade-in-up">
                <button onClick={() => setIsGuideOpen(false)} className="absolute top-4 right-4 w-10 h-10 flex items-center justify-center bg-gray-100 rounded-full font-bold">✕</button>
                
                {/* 1. 尺寸測量 */}
                <h2 className="text-xl md:text-2xl font-black mb-6 text-gray-900 border-b-2 border-pink-100 pb-4 mt-2">📏 如何測量與挑選尺寸？</h2>
                <div className="space-y-6 mb-10">
                   <div className="bg-pink-50 p-6 rounded-2xl border border-pink-100 text-sm font-bold leading-relaxed">
                      <p className="mb-2">📌 測量步驟：</p>
                      <ul className="list-decimal ml-5 space-y-1">
                        <li>使用軟尺沿著指甲「最寬處」的弧度平貼測量（勿壓扁指甲）。</li>
                        <li>測量雙手十指，對照下表挑選。建議選「大不選小」，大一點可微磨，小了會壓甲。</li>
                      </ul>
                   </div>
                   <div className="grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
                      <div className="bg-white border border-gray-100 p-4 rounded-xl shadow-sm"><p className="text-pink-600 font-black">XS</p><p className="text-[10px] text-gray-400">小手首選</p></div>
                      <div className="bg-pink-50 border-2 border-pink-400 p-4 rounded-xl shadow-md"><p className="text-pink-600 font-black">S</p><p className="text-[10px] text-pink-600">約70-80%人適用</p></div>
                      <div className="bg-white border border-gray-100 p-4 rounded-xl shadow-sm"><p className="text-pink-600 font-black">M</p><p className="text-[10px] text-gray-400">一般大眾</p></div>
                      <div className="bg-white border border-gray-100 p-4 rounded-xl shadow-sm"><p className="text-pink-600 font-black">L</p><p className="text-[10px] text-gray-400">偏寬女孩</p></div>
                   </div>
                </div>

                {/* 2. 穿戴教學 */}
                <h2 className="text-xl md:text-2xl font-black mb-6 text-gray-900 border-b-2 border-pink-100 pb-4">✨ 穿戴與卸除教學</h2>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
                   <div className="bg-white border border-gray-100 p-5 rounded-2xl">
                      <h3 className="font-bold text-pink-600 mb-3 flex items-center gap-2">💅 完美配戴 4 步</h3>
                      <ul className="text-xs space-y-3 font-bold">
                        <li className="flex gap-2"><span className="bg-pink-100 text-pink-600 w-5 h-5 rounded-full flex items-center justify-center shrink-0 text-[10px]">1</span> 輕磨甲面去除油脂</li>
                        <li className="flex gap-2"><span className="bg-pink-100 text-pink-600 w-5 h-5 rounded-full flex items-center justify-center shrink-0 text-[10px]">2</span> 酒精棉片徹底清潔</li>
                        <li className="flex gap-2"><span className="bg-pink-100 text-pink-600 w-5 h-5 rounded-full flex items-center justify-center shrink-0 text-[10px]">3</span> 貼上合適尺寸果凍膠</li>
                        <li className="flex gap-2"><span className="bg-pink-100 text-pink-600 w-5 h-5 rounded-full flex items-center justify-center shrink-0 text-[10px]">4</span> 指甲推入按壓15秒</li>
                      </ul>
                   </div>
                   <div className="bg-white border border-gray-100 p-5 rounded-2xl">
                      <h3 className="font-bold text-gray-600 mb-3 flex items-center gap-2">🛁 無痛卸除方式</h3>
                      <ul className="text-xs space-y-3 font-bold">
                        <li className="flex gap-2"><span className="bg-gray-100 text-gray-400 w-5 h-5 rounded-full flex items-center justify-center shrink-0 text-[10px]">1</span> 浸泡溫水3-5分鐘</li>
                        <li className="flex gap-2"><span className="bg-gray-100 text-gray-400 w-5 h-5 rounded-full flex items-center justify-center shrink-0 text-[10px]">2</span> 用小木棒從側面撬開</li>
                        <li className="flex gap-2"><span className="bg-gray-100 text-gray-400 w-5 h-5 rounded-full flex items-center justify-center shrink-0 text-[10px]">3</span> 慢慢推開，切勿硬拔</li>
                        <li className="flex gap-2"><span className="bg-gray-100 text-gray-400 w-5 h-5 rounded-full flex items-center justify-center shrink-0 text-[10px]">4</span> 甲片清理殘膠可重複用</li>
                      </ul>
                   </div>
                </div>

                {/* 3. 製作流程 */}
                <h2 className="text-xl md:text-2xl font-black mb-6 text-gray-900 border-b-2 border-pink-100 pb-4">💅 專業純手工製作工序</h2>
                <div className="bg-amber-50 p-6 rounded-3xl border border-amber-100 mb-6">
                   <div className="flex flex-col gap-3 max-w-[280px] mx-auto py-2">
                      {[
                        { num: '1/', text: '甲片精細打磨', color: 'bg-green-500' },
                        { num: '2/', text: '專業吻合劑', color: 'bg-green-400' },
                        { num: '3/', text: '品牌底膠加固', color: 'bg-blue-400' },
                        { num: '4/', text: '多層甲油膠彩繪', color: 'bg-green-500' },
                        { num: '5/', text: '專業飾品膠黏貼', color: 'bg-green-400' },
                        { num: '6/', text: '加固封層保護', color: 'bg-blue-400' },
                        { num: '7/', text: '高耐磨封層完工', color: 'bg-green-500' },
                      ].map((step, idx) => (
                        <div key={idx} className={`${step.color} text-white px-5 py-2.5 rounded-full shadow-md flex items-center gap-3 transform hover:scale-105 transition`}>
                          <span className="text-xl font-light italic">{step.num}</span>
                          <span className="text-sm font-bold tracking-wider">{step.text}</span>
                        </div>
                      ))}
                   </div>
                   <p className="text-[10px] text-center text-amber-700 mt-6 font-bold tracking-widest leading-loose uppercase">一副十片・純手工光療訂製<br/>媲美美甲店質感・穿戴方便</p>
                </div>
              </div>
            </div>
          )}

          <style dangerouslySetInnerHTML={{__html: ` 
            .animate-fade-in-right { animation: fadeInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; } 
            @keyframes fadeInRight { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } } 
            .animate-fade-in-up { animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
            @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
          `}} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Shop />);
  </script>
</body>
</html>
