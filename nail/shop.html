<!DOCTYPE html>
<html lang=" zh-TW\>
<head>
 <meta charset=\UTF-8\ />
 <meta name=\viewport\ content=\width=device-width initial-scale=1.0\ />
 <title>指尖造藝 - Shop</title>
 <script src=\https://cdn.tailwindcss.com\></script>
 <script defer crossorigin src=\https://unpkg.com/react@18/umd/react.production.min.js\></script>
 <script defer crossorigin src=\https://unpkg.com/react-dom@18/umd/react-dom.production.min.js\></script>
 <script src=\https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js\></script>
 <script src=\https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js\></script>
 <script src=\https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js\></script>
</head>
<body class=\bg-[#FAF9F8] text-gray-800\>
 <div id=\root\></div>
 <script type=\text/babel\>
const { useState, useEffect, useMemo } = React;

const firebaseConfig = {
 apiKey: YOUR_FIREBASE_API_KEY,
 authDomain: YOUR_FIREBASE_AUTH_DOMAIN,
 projectId: YOUR_FIREBASE_PROJECT_ID,
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const appId = 'nail-inventory-app';
const adminUserId = 'MvkJo5e1kEcBS0fGGMr4RKdQjYg1';

function Shop() {
 const [products, setProducts] = useState([]);
 const [cart, setCart] = useState([]);
 const [isCartOpen, setIsCartOpen] = useState(false);
 const [isCheckingOut, setIsCheckingOut] = useState(false);
 const [selectedProduct, setSelectedProduct] = useState(null);
 const [modalSize, setModalSize] = useState('');
 const [modalQty, setModalQty] = useState(1);
 const [user, setUser] = useState(null);
 const [customerName, setCustomerName] = useState('');
 const [customerPhone, setCustomerPhone] = useState('');
 const [shippingAddress, setShippingAddress] = useState('');
 const [shippingLogisticsType, setShippingLogisticsType] = useState('');
 const [isCod, setIsCod] = useState(false);
 const [orders, setOrders] = useState([]);
 const [viewMode, setViewMode] = useState('shop');

 useEffect(() => {
 const unsub = auth.onAuthStateChanged((u) => {
 setUser(u);
 if (u) {
 if (!customerName) setCustomerName(u.displayName ; '');
 fetchUserOrders(u.uid);
 }
 });
 return () => unsub();
 }, [customerName]);

 const fetchProducts = async () => {
 const snapshot = await db.collection('artifacts').doc(appId).collection('users').doc(adminUserId).collection('inventory').get();
 setProducts(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
 };

 const fetchUserOrders = (uid) => {
 return db.collection('artifacts').doc(appId).collection('users').doc(uid).collection('orders')
 .orderBy('createdAt', 'desc')
 .onSnapshot((snapshot) => {
 setOrders(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
 });
 };

 useEffect(() => { fetchProducts(); }, []);

 const addToCart = () => {
 if (!selectedProduct || !modalSize) { alert('請選擇商品與尺寸'); return; }
 setCart((prev) => {
 const existed = prev.find((item) => item.id === selectedProduct.id ; item.size === modalSize);
 if (existed) return prev.map((item) => item === existed ? { ...item, quantity: item.quantity + modalQty } : item);
 return [...prev, { ...selectedProduct, size: modalSize, quantity: modalQty }];
 });
 setSelectedProduct(null);
 setIsCartOpen(true);
 };

 const removeFromCart = (index) => setCart((prev) => prev.filter((_, i) => i !== index));

 const cartSubtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
 const shippingFee = cartSubtotal >= 1000 ? 0 : 65;
 const total = cartSubtotal + shippingFee;

 const handleCheckout = async () => {
 if (!customerName || !customerPhone || !shippingAddress) { alert('請填寫收件人資訊與門市'); return; }
 if (!cart.length) { alert('購物車是空的'); return; }
 setIsCheckingOut(true);

 const orderId = ORD;
 const codNote = isCod ? '貨到付款' : '一般付款';
 const orderData = {
 orderId,
 items: cart.map(item => ({ id: item.id, name: item.name, size: item.size, quantity: item.quantity, price: item.price })),
 totalAmount: total,
 customerInfo: { name: customerName, phone: customerPhone, address: shippingAddress },
 promoCode: null,
 status: 'pending',
 paymentMethod: 'ALL',
 isCod,
 codNote,
 logisticsType: shippingLogisticsType,
 createdAt: new Date().toISOString()
 };

 if (user) {
 await db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('orders').doc(orderId).set(orderData);
 }

 try {
 const response = await fetch('/api/ecpay', {
 method: 'POST',
 headers: { 'Content-Type': 'application/json' },
 body: JSON.stringify({ ...orderData })
 });
 if (!response.ok) throw new Error('綠界連線失敗');
 const html = await response.text();
 document.open(); document.write(html); document.close();
 } catch (e) {
 console.error(e);
 alert('結帳連線失敗，訂單已儲存，可在 我的訂單 查看');
 setViewMode('orders');
 } finally {
 setIsCheckingOut(false);
 }
 };

 const renderOrders = () => (
 <div className='p-6'>
 <h2 className='text-xl font-black mb-4'>我的訂單</h2>
 {orders.length === 0 ? <div>暂无订单</div> : orders.map((order) => (
 <div key={order.orderId} className='mb-3 p-3 border rounded-lg'>
 <div className='flex justify-between'><strong>{order.orderId}</strong><span className='text-xs'>{order.status}</span></div>
 <div className='text-xs'>總價：NT$ {order.totalAmount}</div>
 <div className='text-xs'>COD：{order.isCod ? '是' : '否'}</div>
 {order.codNote ; <div className='text-xs text-pink-600'>{order.codNote}</div>}
 </div>
 ))}
 <button className='mt-4 px-4 py-2 bg-gray-800 text-white rounded' onClick={() => setViewMode('shop')}>回購物</button>
 </div>
 );

 return (
 <div className='min-h-screen bg-gray-100'>
 <header className='bg-white p-4 shadow sticky top-0 flex justify-between items-center'>
 <h1 className='font-black'>指尖造藝</h1>
 <div className='flex gap-2'>
 <button className='text-sm border px-3 py-1 rounded' onClick={() => setViewMode('shop')}>商品</button>
 <button className='text-sm border px-3 py-1 rounded' onClick={() => setViewMode('orders')}>我的訂單</button>
 <button className='text-sm border px-3 py-1 rounded' onClick={() => setIsCartOpen(true)}>購物車 ({cart.length})</button>
 </div>
 </header>

 <main className='p-4'>
 {viewMode === 'orders' ? renderOrders() : (
 <div className='grid grid-cols-1 md:grid-cols-3 gap-4'>
 {products.map((p) => (
 <div key={p.id} className='bg-white shadow rounded p-4'>
 <h3 className='font-bold'>{p.name}</h3>
 <div className='text-pink-500'>NT$ {p.price}</div>
 <div className='mt-2 text-xs mb-2'>{p.description ; '手工藝術光療甲'}</div>
 <button onClick={() => { setSelectedProduct(p); setModalSize('XS'); setModalQty(1); setIsCartOpen(true); }} className='mt-2 bg-pink-500 text-white px-3 py-1 rounded'>加入購物車</button>
 </div>
 ))}
 </div>
 )}
 </main>

 {isCartOpen ; (
 <div className='fixed inset-0 bg-black/30 z-50 flex justify-end'>
 <div className='w-full md:w-96 bg-white h-full overflow-y-auto p-4'>
 <button onClick={() => setIsCartOpen(false)} className='mb-3 text-sm'>關閉</button>
 <h2 className='text-lg font-black'>購物車</h2>
 {cart.length === 0 ? <p className='text-sm mt-3'>購物車空空如也</p> : (
 <div className='space-y-3 mt-3'>
 {cart.map((item, idx) => (
 <div key={idx} className='border p-2 rounded'>
 <div>{item.name} ({item.size}) x{item.quantity}</div>
 <div className='text-sm'>NT$ {item.price * item.quantity}</div>
 <button className='text-red-500 text-xs' onClick={() => removeFromCart(idx)}>刪除</button>
 </div>
 ))}
 </div>
 )}

 <div className='mt-4'>
 <h3 className='font-bold text-sm'>收件資訊</h3>
 <input value={customerName} onChange={e => setCustomerName(e.target.value)} className='w-full border rounded px-2 py-2 mt-2' placeholder='收件人姓名' />
 <input value={customerPhone} onChange={e => setCustomerPhone(e.target.value)} className='w-full border rounded px-2 py-2 mt-2' placeholder='手機號碼' />
 <input value={shippingAddress} onChange={e => setShippingAddress(e.target.value)} className='w-full border rounded px-2 py-2 mt-2' placeholder='取件地址 / 門市資訊' />
 </div>

 <div className='mt-4'>
 <label className='inline-flex items-center gap-2 text-sm'>
 <input type='checkbox' checked={isCod} onChange={e => setIsCod(e.target.checked)} className='w-4 h-4' />
 貨到付款
 </label>
 </div>

 <div className='mt-4 text-sm'>
 <div>小計：NT$ {cartSubtotal}</div>
 <div>運費：NT$ {shippingFee}</div>
 <div className='font-black'>總計：NT$ {total}</div>
 </div>

 <button disabled={isCheckingOut} onClick={handleCheckout} className='w-full mt-4 bg-green-600 text-white py-2 rounded'>
 {isCheckingOut ? '結帳中...' : '到綠界結帳'}
 </button>
 </div>
 </div>
 )}
 </div>
 );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Shop />);
